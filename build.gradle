plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kitschcatch'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
	implementation 'com.drewnoakes:metadata-extractor:2.19.0'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'software.amazon.awssdk:s3:2.44.4'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// 전체 통합 테스트에서 사용하지 않는 Spring 컨텍스트가 쌓이지 않게 한다.
	systemProperty 'spring.test.context.cache.maxSize', '3'
}

tasks.register('storeCsv', JavaExec) {
	group = 'application'
	description = '명시한 PostgreSQL 대상에서 검수 매장 CSV를 dry-run 또는 apply한다.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.kitschcatch.backend.tools.storecsv.StoreCsvCommand'
}

tasks.register('storeContent', JavaExec) {
	group = 'application'
	description = '검수한 매장 상세 JSON을 명시한 PostgreSQL 대상에 검증·반영한다.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.kitschcatch.backend.tools.storecontent.StoreContentCommand'
}
