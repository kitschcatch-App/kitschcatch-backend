spring:
  application:
    name: kitschcatch-backend
  jpa:
    open-in-view: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

kakao:
  oauth:
    native-app-key: ${KAKAO_NATIVE_APP_KEY:}
    issuer-uri: https://kauth.kakao.com
    jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json

app:
  refunds:
    operator-user-ids: ${APP_REFUNDS_OPERATOR_USER_IDS:}
  settlement:
    operator-user-ids: ${APP_SETTLEMENT_OPERATOR_USER_IDS:}
    fee-basis-points: ${APP_SETTLEMENT_FEE_BASIS_POINTS:500}
    toss:
      enabled: ${APP_SETTLEMENT_TOSS_ENABLED:false}
      base-url: ${APP_SETTLEMENT_TOSS_BASE_URL:https://api.tosspayments.com}
      secret-key: ${APP_SETTLEMENT_TOSS_SECRET_KEY:}
      security-key: ${APP_SETTLEMENT_TOSS_SECURITY_KEY:}
      timeout-millis: ${APP_SETTLEMENT_TOSS_TIMEOUT_MILLIS:5000}
      lookup-max-pages: ${APP_SETTLEMENT_TOSS_LOOKUP_MAX_PAGES:10}
  profile-image:
    max-size-bytes: ${APP_PROFILE_IMAGE_MAX_SIZE_BYTES:5000000}
    upload-url-ttl: ${APP_PROFILE_IMAGE_UPLOAD_URL_TTL:10m}
  orders:
    reservation-ttl: 15m
    expiration-scan-delay: 60s
    expiration-enabled: true
  payments:
    recovery:
      scan-delay: 30s
      success-scan-delay: 1h
      batch-size: 100
      enabled: false
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-kitschcatch-jwt-secret-32-bytes}
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL:14d}
  s3:
    region: ${APP_S3_REGION:ap-northeast-2}
    bucket: ${APP_S3_BUCKET:}
    public-base-url: ${APP_S3_PUBLIC_BASE_URL:}
    upload-url-ttl: ${APP_S3_UPLOAD_URL_TTL:5m}
    post-image-prefix: ${APP_S3_POST_IMAGE_PREFIX:posts}
    chat-image-prefix: ${APP_S3_CHAT_IMAGE_PREFIX:chats}
  toss-payments:
    connect-timeout: ${APP_TOSS_PAYMENTS_CONNECT_TIMEOUT:3s}
    read-timeout: ${APP_TOSS_PAYMENTS_READ_TIMEOUT:10s}
    base-url: ${APP_TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${APP_TOSS_PAYMENTS_SECRET_KEY:}
